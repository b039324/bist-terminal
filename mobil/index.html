<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BIST Mobil</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="mobil.css?v=9">
</head>
<body>

<!-- Şifre ekranı (masaüstü sürümüyle aynı şifre ve aynı localStorage anahtarı) -->
<div id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-card" autocomplete="on">
    <h1>BIST Mobil</h1>
    <p class="sub">Masaüstü sürümdeki şifreyi gir.</p>
    <label class="field">
      <span>Şifre</span>
      <input id="lockPass" type="password" autocomplete="current-password" required>
    </label>
    <div id="lockErr" class="err" role="alert"></div>
    <button type="submit" class="primary">Giriş</button>
  </form>
</div>

<div id="app" hidden>
  <main id="view" tabindex="-1"></main>
  <nav id="nav" aria-label="Ana menü">
    <a href="#/takip" data-tab="takip">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 3 14.8 9 21 9.7 16.4 14 17.7 20.5 12 17.2 6.3 20.5 7.6 14 3 9.7 9.2 9"/></svg>
      Takip
    </a>
    <a href="#/portfoy" data-tab="portfoy">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
      Portföy
    </a>
    <a href="#/bist" data-tab="bist">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="11"/><line x1="12" y1="20" x2="12" y2="5"/><line x1="18" y1="20" x2="18" y2="14"/></svg>
      Piyasalar
    </a>
    <a href="#/harita" data-tab="harita">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="11" height="10" rx="1.5"/><rect x="16" y="3" width="5" height="6" rx="1.5"/><rect x="16" y="11" width="5" height="10" rx="1.5"/><rect x="3" y="15" width="11" height="6" rx="1.5"/></svg>
      Harita
    </a>
    <a href="#/sinyaller" data-tab="sinyaller">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/></svg>
      Sinyaller
    </a>
  </nav>
</div>

<!-- Alım / Satım ekranı -->
<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Alım veya satım ekle" hidden>
  <div class="seg" role="group" aria-label="İşlem türü">
    <button type="button" data-mode="buy" class="on">Alım</button>
    <button type="button" data-mode="sell">Satım</button>
  </div>
  <label class="field">
    <span>Hisse kodu</span>
    <input id="shSym" list="symList" autocapitalize="characters" autocomplete="off" placeholder="örn. THYAO">
  </label>
  <div class="two">
    <label class="field">
      <span>Adet</span>
      <input id="shQty" inputmode="decimal" autocomplete="off" placeholder="0">
    </label>
    <label class="field">
      <span id="shPriceLbl">Maliyet (₺)</span>
      <input id="shPrice" inputmode="decimal" autocomplete="off" placeholder="0,00">
    </label>
  </div>
  <div id="shErr" class="err" role="alert"></div>
  <div class="two">
    <button type="button" id="shCancel" class="ghost">Vazgeç</button>
    <button type="button" id="shSave" class="primary">Kaydet</button>
  </div>
  <datalist id="symList"></datalist>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../config.js"></script>
<script src="mobil.js?v=9"></script>
</body>
</html>
